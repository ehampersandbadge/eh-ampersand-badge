<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Connection Test (not part of the live site)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #1e293b; }
  h1 { font-size: 1.3rem; }
  section { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  button { background: #1d3a6e; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin: 4px 4px 4px 0; font-size: 0.9rem; }
  button:hover { background: #2a4e8f; }
  input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 4px 4px 4px 0; }
  #log { background: #0f172a; color: #4ade80; font-family: monospace; font-size: 0.8rem; padding: 12px; border-radius: 8px; white-space: pre-wrap; height: 220px; overflow-y: auto; }
  .banner { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="banner">This is a standalone test page for checking the new Firebase project. It is completely separate from the real badge tracker site and does not touch any student data.</div>

<h1>1. Sign-in test</h1>
<section>
  <div>
    <input type="email" id="email" placeholder="email@emoryhenry.edu">
    <input type="password" id="password" placeholder="password (min 6 characters)">
  </div>
  <button onclick="doSignUp()">Create test account</button>
  <button onclick="doSignIn()">Sign in</button>
  <button onclick="doGoogleSignIn()">Sign in with Google</button>
  <button onclick="doSignOut()">Sign out</button>
  <div id="whoami" style="margin-top:10px; font-weight:bold;">Not signed in</div>
</section>

<h1>2. Database test</h1>
<section>
  <p style="font-size:0.9rem; color:#64748b;">Requires being signed in above. Writes/reads a single test document only.</p>
  <button onclick="doWriteTest()">Write test document</button>
  <button onclick="doReadTest()">Read test document</button>
</section>

<h1>Log</h1>
<div id="log"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged
  } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
  import {
    getFirestore, doc, setDoc, getDoc, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';

  // ---- Paste-in config from the Firebase console ----
  const firebaseConfig = {
    apiKey: "AIzaSyAhLSCvUZ_z9KayAD7xN08KXmeGuMF6fzE",
    authDomain: "ampersand-badge-database-f258a.firebaseapp.com",
    projectId: "ampersand-badge-database-f258a",
    storageBucket: "ampersand-badge-database-f258a.firebasestorage.app",
    messagingSenderId: "47291050684",
    appId: "1:47291050684:web:be9b1e8d5746a8a0447eb9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const logEl = document.getElementById('log');
  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logEl.textContent += `[${time}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  onAuthStateChanged(auth, (user) => {
    document.getElementById('whoami').textContent = user ? `Signed in as: ${user.email}` : 'Not signed in';
    log(user ? `Auth state: signed in as ${user.email}` : 'Auth state: signed out');
  });

  window.doSignUp = async function () {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      log(`Created test account: ${cred.user.email}`);
    } catch (err) {
      log(`Sign-up error: ${err.code} - ${err.message}`);
    }
  };

  window.doSignIn = async function () {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      log(`Signed in: ${cred.user.email}`);
    } catch (err) {
      log(`Sign-in error: ${err.code} - ${err.message}`);
    }
  };

  window.doGoogleSignIn = async function () {
    try {
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      log(`Signed in with Google: ${cred.user.email}`);
    } catch (err) {
      log(`Google sign-in error: ${err.code} - ${err.message}`);
    }
  };

  window.doSignOut = async function () {
    await signOut(auth);
    log('Signed out.');
  };

  window.doWriteTest = async function () {
    if (!auth.currentUser) { log('Write failed: not signed in.'); return; }
    try {
      await setDoc(doc(db, 'connectionTest', 'ping'), {
        message: 'Hello from the test page!',
        writtenBy: auth.currentUser.email,
        writtenAt: serverTimestamp()
      });
      log('Write succeeded: connectionTest/ping');
    } catch (err) {
      log(`Write error: ${err.code} - ${err.message}`);
    }
  };

  window.doReadTest = async function () {
    if (!auth.currentUser) { log('Read failed: not signed in.'); return; }
    try {
      const snap = await getDoc(doc(db, 'connectionTest', 'ping'));
      log(snap.exists() ? `Read succeeded: ${JSON.stringify(snap.data())}` : 'Read succeeded, but no document exists yet - try Write first.');
    } catch (err) {
      log(`Read error: ${err.code} - ${err.message}`);
    }
  };
</script>
</body>
</html>
